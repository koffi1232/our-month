<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <title>Advent Calendar 2021</title>
  <meta name="description" content="Advent Calendar 2021 on native Web technologies.">
  <link href="advent2021.css" rel="stylesheet" Content-Type="text/css" media="screen" />
  <style>
    @font-face {
      font-family: 'Architects Daughter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(https://fonts.gstatic.com/s/architectsdaughter/v11/KtkxAKiDZI_td1Lkx62xHZHDtgO_Y-bvTYlg4w.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    .calendar {
      font-family: 'Architects Daughter';
      background-image: url(hearts.jpg);
      background-size: cover;
      background-position: center;
      padding: 2rem;
      display: grid;
      width: 100%;
      max-width: 740px;
      margin: auto;

      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto;
      grid-gap: 1rem;
      grid-template-areas:
        "t   t   t   t"
        "d1  d2  d3  d4"
        "d5  d6  d7  d8"
        "d9 d10  d11 d12"
        "d13 d14 d15 d16"
        "d17 d18 d19 d20"
        "d21 d22 d23 d24"
        "d25 d26 d27 d28"
        "d29 d30 d31 d31";
    }

    .calendar>a,
    .calendar>a:visited {
      display: inline-block;
      box-sizing: border-box;
      border: transparent 0.2rem dotted;
      width: 100%;
      height: 4.4rem;
      background: rgb(0, 0, 255, 0.4);
      border-radius: 1rem;
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
      padding: 1rem;
      color: transparent;
      text-decoration: none;
    }

    .calendar>a:hover {
      color: white;
      border: white 0.2rem dotted;
      background: rgb(0, 0, 255, 0.6);
    }

    .calendar>a[href] {
      color: gold;
    }
  </style>
</head>

<body>

 <div class="calendar">
    <a style="grid-area:t;color:white;border:none">Наш месяц</a>
    <a style='grid-area:d1' href="01.htm">1</a>
    <a style='grid-area:d2' href="02.htm">2</a>

    <a style='grid-area:d6' href="06.htm">6</a>
    <a style='grid-area:d7' href="07.htm">7</a>
    <a style='grid-area:d8' href="08.htm">8</a>
    <a style='grid-area:d9' href="09.htm">9</a>
    <a style='grid-area:d10' href="10.htm">10</a>
    <a style='grid-area:d11' href="11.htm">11</a>
    <a style='grid-area:d12' href="12.htm">12</a>
    <a style='grid-area:d13' href="13.htm">13</a>

  </div>
<script>
const startDate = new Date(2026, 9, 17);
const today = new Date();
today.setHours(0, 0, 0, 0);

document.querySelectorAll('.calendar a').forEach((el) => {
  const txt = el.textContent.trim();
  if (!/^\d+$/.test(txt)) return;

  const dayNum = parseInt(txt, 10);
  const openDate = new Date(startDate);
  openDate.setDate(startDate.getDate() + (dayNum - 1));

  if (today >= openDate) {
    el.setAttribute('href', String(dayNum).padStart(2, '0') + '.htm');
    el.style.opacity = '1';
    el.style.cursor = 'pointer';
    el.removeAttribute('data-locked');
    el.removeAttribute('title');
  } else {
    el.removeAttribute('href');
    el.dataset.locked = 'true';
    el.style.opacity = '0.4';
    el.style.cursor = 'not-allowed';
    el.title = 'Откроется ' + openDate.toLocaleDateString('ru-RU');
  }
});

document.addEventListener('click', e => {
  const a = e.target.closest('.calendar a[data-locked]');
  if (a) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);
</script>
</body>
